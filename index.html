<html lang="en">
<head>

<title>GainTrain Cancel Boss</title>
<style>
:root{
  --bg:#070b24;--neon:#29d3ff;--pink:#ff3d9a;--yellow:#ffd23f;
  --page:#f3f4f6;--ink:#1f2937;--muted:#9ca3af;--faint:#d1d5db;--green:#16a34a;--red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);
  background-image:linear-gradient(rgba(41,211,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(41,211,255,.06) 1px,transparent 1px);
  background-size:32px 32px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e5e7eb;
  display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
.title{font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--neon);font-size:13px;margin-bottom:6px;text-align:center}
.title b{color:#fff;font-size:22px;display:block;letter-spacing:.06em;text-shadow:0 0 12px var(--pink)}
.hud{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;margin:12px 0;gap:10px;flex-wrap:wrap}
.boss{border:2px solid var(--neon);padding:5px 10px;color:var(--neon)}
.hp{display:flex;gap:3px;align-items:center;color:var(--yellow)}
.hp span{margin-right:6px}
.hp i{width:18px;height:11px;background:var(--yellow);display:inline-block;transition:background .4s,transform .4s}
.hp i.gone{background:#2a2f4a;transform:scaleY(.5)}
.stats{color:var(--pink)}
.win{width:100%;max-width:760px;background:var(--page);color:var(--ink);border:2px solid var(--neon);
  box-shadow:0 0 40px rgba(41,211,255,.25);position:relative;overflow:hidden}
.bar{background:#e5e7eb;padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.url{margin-left:8px;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{padding:26px 30px 64px;position:relative;min-height:470px}
.prog{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.04em}
.cat{position:absolute;top:18px;right:22px;text-align:center;font-size:11px;color:var(--muted);width:80px}
.cat div{font-size:34px;line-height:1}
h1{font-size:24px;margin:0 90px 10px 0}
h2{font-size:19px;margin:0 90px 10px 0}
p{margin:0 0 14px;line-height:1.45;font-size:14px;color:#4b5563}
button{font:inherit;cursor:pointer;border:0}
.big{display:block;width:100%;padding:16px;font-weight:800;font-size:16px;letter-spacing:.03em;color:#fff;background:var(--green);margin:16px 0 12px;border-radius:2px}
.big:hover{filter:brightness(1.08)}
.grey{background:#e5e7eb;color:#9ca3af;padding:10px 18px;font-size:13px;margin-top:10px}
.blue{background:#2563eb;color:#fff;padding:12px 20px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:#374151;margin:4px 0}
.urgent{color:var(--red);font-weight:700;font-size:13px;margin:10px 0}
.hidden-exit{position:absolute;right:14px;bottom:30px;font-size:9px;color:#d4d6da;cursor:default;text-decoration:none}
.fine{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:#c4c7cc}
select,input[type=text]{font:inherit;padding:10px;border:1px solid var(--faint);width:100%;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* prefs */
.pref{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #e5e7eb;font-size:14px;gap:12px}
.sw{width:58px;height:26px;border-radius:13px;position:relative;flex:none;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;padding:0 8px}
.sw.on{background:#9ca3af;justify-content:flex-start}     /* ON is grey */
.sw.off{background:var(--green);justify-content:flex-end} /* OFF is green */
.sw::after{content:"";position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on::after{left:35px}.sw.off::after{left:3px}
/* slider */
.pct{font-size:56px;font-weight:900;text-align:center;margin:8px 0;color:#111}
input[type=range]{width:100%;accent-color:var(--pink)}
.tiny{font-size:10px;padding:1px 5px;background:#eee;color:#bbb;margin-left:6px}
/* chat */
.chat{border:1px solid var(--faint);background:#fff;height:250px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:78%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.35}
.bot{background:#eef2ff;align-self:flex-start}
.me{background:var(--green);color:#fff;align-self:flex-end}
.typing{color:var(--muted);font-style:italic;font-size:12px}
/* runaway */
.arena{position:relative;height:270px;border:1px dashed var(--faint);background:#fff;margin-top:10px;overflow:hidden}
#run{position:absolute;background:var(--pink);color:#fff;padding:10px 16px;font-weight:700;transition:left .12s,top .12s,transform .12s;white-space:nowrap}
.stay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--green);color:#fff;padding:18px 26px;font-weight:800;font-size:16px}
/* maze */
.maze{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,396px);margin:10px auto;border:3px solid #111;touch-action:none}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;user-select:none}
.wall{background:#1f2937}
.open{background:#fff}
.start{background:#bae6fd}
.goal{background:#fbcfe8}
.maze.armed .open,.maze.armed .start{background:#ecfeff}
/* cat */
.petcat{font-size:110px;background:none;display:block;margin:10px auto;transition:transform .1s}
.petcat:active{transform:scale(.92)}
/* loading */
.spin{width:54px;height:54px;border:6px solid #e5e7eb;border-top-color:var(--pink);border-radius:50%;margin:60px auto 20px;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.center{text-align:center}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--faint);padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pink)}
.stat span{font-size:11px;color:#6b7280}
/* modal + toast */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;max-width:420px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);position:relative}
.modal h3{margin:0 0 8px}
.x{position:absolute;top:4px;right:8px;background:none;color:#ccc;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#111827;color:#fff;
  padding:12px 18px;border:2px solid var(--pink);font-size:14px;transition:transform .3s;z-index:50;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
/* ---- crazy layer ---- */
.win{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{translate:0}20%{translate:-14px 4px}40%{translate:12px -6px}60%{translate:-8px 6px}80%{translate:6px -2px}}
.glitch{animation:glitch .5s steps(2) 3}
@keyframes glitch{0%{text-shadow:3px 0 var(--pink),-3px 0 var(--neon);transform:skewX(-8deg)}50%{text-shadow:-3px 0 var(--pink),3px 0 var(--neon);transform:skewX(6deg)}100%{text-shadow:none;transform:none}}
.ad{position:absolute;z-index:8;width:220px;background:linear-gradient(135deg,#fde047,#f472b6);color:#111;padding:14px 14px 12px;font-weight:800;
  border:3px dashed #111;box-shadow:6px 6px 0 #111;animation:pop .35s cubic-bezier(.3,1.8,.5,1);font-size:14px;text-align:center}
.ad small{display:block;font-weight:500;font-size:11px;margin-top:4px}
.ad .ax{position:absolute;top:2px;right:4px;background:none;font-size:11px;color:#555;padding:2px 4px;transition:top .15s,right .15s}
.ad .claim{margin-top:8px;background:#111;color:#fde047;padding:6px 10px;font-weight:800}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.grow{transition:transform .25s}

<div class="title">&gt; KEYTOS HACK · MINI-CHALLENGE 01<b>WORST CANCEL SCREEN EVER</b></div>

  <div class="boss">BOSS · THE CANCEL SCREEN</div>
  <div class="hp" id="hp"><span>HP</span></div>
  <div class="stats" id="stats">TIME 0:00 · CLICKS 0</div>

<script>
const STEPS = 12; // index 0..11, HP drops one per step
const fakeShown = [1,2,4,3,7,2,9,11,8,14,15,15];
const fakeTotal = [15,15,47,12,404,47,99,15,15,3,1,"∞"];
const catMood = ["watch","watch","watch","sad","shock","watch","sad","shock","sad","sad","sad","sad"];
let S;
function reset(){
  S = {step:0,clicks:0,start:Date.now(),judge:false,declined:0,usedReasons:new Set(),
       sliderResets:0,wallHits:0,idleResets:0,cancelMentions:0,pets:0,dodges:0,ac:false,timer:299};
}
reset();

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- HUD ----------
const hp = $("#hp");
for (let i=0;i<STEPS-1;i++) hp.appendChild(document.createElement("i"));
function drawHUD(){
  [...hp.querySelectorAll("i")].forEach((el,i)=> el.classList.toggle("gone", i >= (STEPS-1-S.step)));
  const t = Math.floor((Date.now()-S.start)/1000);
  $("#stats").textContent = `TIME ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")} · CLICKS ${S.clicks}`;

      say(cancelReplies[i], i===3? ()=>setTimeout(()=>go(6),1400) : null);
    } else say(other[Math.floor(Math.random()*other.length)]);
  };
},

// 8 · Retention maze
b=>{
  const M=["S.#......",
           "#.#.####.",
           "#...#..#.",
           "####.#.#.",
           "#....#...",
           "#.####.##",
           "#.......G"];
  b.innerHTML=`
  <h2>Find the exit (past the treadmills)</h2>
  <p>Hover over START, then guide your mouse to the glowing red door without touching a wall. Prefer keys? Use the arrow keys.</p>
  <div class="maze" id="mz"></div><p id="mzs" class="center" style="font-size:12px"></p>`;
  const mz=$("#mz"); let pos=[0,0], armed=false;
  M.forEach((row,r)=>[...row].forEach((ch,c)=>{
    const d=document.createElement("div");
    d.className="cell "+(ch==="#"?"wall":ch==="S"?"start":ch==="G"?"goal":"open");
    d.dataset.r=r; d.dataset.c=c; d.innerHTML= ch==="S"?'<span class="lbl">START</span>':ch==="G"?'<span class="door"></span>':"";
    mz.appendChild(d);
  }));
  const cell=(r,c)=>mz.children[r*9+c];
  const drawTok=()=>{ mz.querySelectorAll(".tok").forEach(t=>t.remove());
    const t=document.createElement("span"); t.className="tok"; cell(...pos).appendChild(t); };
  const status=t=>$("#mzs").textContent=t;
  const fail=()=>{ shake(); armed=false; mz.classList.remove("armed"); S.wallHits++; pos=[0,0]; drawTok();
    modal(`<h3>You walked into the squat rack!</h3><p>Book a personal trainer to help you find the exit?</p>`,[{label:"Book a trainer",cls:"big",fn:()=>toast("Nice try, we know you don't mean it. Back to the start!")},{label:"Back to start",cls:"grey"}]); };
  const win=()=>{ armed=false; document.removeEventListener("keydown",keys); toast("You escaped the maze! "); setTimeout(()=>go(9),700); };
  mz.addEventListener("pointerover",e=>{
    const d=e.target.closest(".cell"); if(!d) return;
    const r=+d.dataset.r,c=+d.dataset.c,ch=M[r][c];
    if(ch==="S"){ armed=true; mz.classList.add("armed"); status("Armed. Don't touch the walls…"); pos=[r,c]; drawTok(); return; }
    if(!armed) return;
    if(ch==="#") return fail();
    pos=[r,c]; drawTok();
    if(ch==="G") win();
  });
  mz.addEventListener("pointerleave",()=>{ if(armed){ armed=false; mz.classList.remove("armed"); status("You left the maze. That counts as quitting. Start again."); }});
  function keys(e){
    const dir={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key]; if(!dir||S.step!==8) return;
    e.preventDefault();
    const r=pos[0]+dir[0], c=pos[1]+dir[1];
    if(r<0||c<0||r>=M.length||c>=9||M[r][c]==="#"){ status("Bonk. "); return; }
    pos=[r,c]; drawTok(); status("");
    if(M[r][c]==="G") win();
  }
  document.addEventListener("keydown",keys);
  drawTok();
},
